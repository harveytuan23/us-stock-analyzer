name: Monthly picks

on:
  schedule:
    - cron: "30 22 * * 1-5" # after the US close, every weekday
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: picks
  cancel-in-progress: false

jobs:
  picks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/picks.ts
      - name: Commit updated list
        run: |
          if git diff --quiet data/picks.json; then
            echo "No change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/picks.json
          git commit -m "更新本月名單 $(date -u +%F)"
          git push
