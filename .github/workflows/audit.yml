name: Strategy audit

on:
  push:
    branches: [claude/project-thread-5shswp]
    paths: [audit/**, .github/workflows/audit.yml]

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node audit/audit.ts
