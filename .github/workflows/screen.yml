name: Screen

on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-zxaxki]
    paths: [scripts/screen.ts, .github/workflows/screen.yml]

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/screen.ts
